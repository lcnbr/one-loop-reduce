[package]
name = "one-loop-reduce-python"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Symbolica-community Python bindings for one-loop-reduce"
publish = false

[lib]
name = "oneloopreduce_python"
# `rlib` so symbolica-community can link the module in; `cdylib` so the crate can
# also be built on its own. Matches the `example_extension` template.
crate-type = ["rlib", "cdylib"]

[dependencies]
feynkit-py = { git = "https://github.com/alphal00p/gammaloop", branch = "preserve-canonical-numerator-interfaces", default-features = false }
one-loop-reduce = { path = "../one-loop-reduce", version = "0.1.0", default-features = false }

# Same crates.io requirement as the library crate -- see the note in the
# workspace root Cargo.toml. If the two ever disagree, or if either becomes a git
# dependency, the consuming root ends up with two symbolica copies and two
# disjoint global symbol tables.
#
# `python_export` (NOT `python_api`) is what gates `symbolica::api::python`.
symbolica = { version = "3.0.1", default-features = false, features = ["python_export"] }

# Must track the pyo3 that symbolica itself depends on (0.28), otherwise
# `PythonExpression` here and `PythonExpression` there are different types.
#
# Deliberately no features: `pyo3/extension-module` and `pyo3/abi3` belong to the
# consuming root (symbolica-community drives them through maturin). Enabling
# either from this leaf would be unified onto every other consumer and break the
# root build.
pyo3 = "0.28"

pyo3-stub-gen = { version = "0.17", optional = true, default-features = false }

[features]
default = ["native"]
native = ["feynkit-py/native", "symbolica/integer-gmp", "symbolica/float-mpfr", "symbolica/native_code_generation", "one-loop-reduce/native"]
wasm = ["feynkit-py/wasm", "symbolica/wasm", "one-loop-reduce/wasm"]
python_stubgen = ["feynkit-py/python_stubgen", "pyo3-stub-gen", "symbolica/python_stubgen"]
