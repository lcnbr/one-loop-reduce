[package]
name = "one-loop-reduce"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "One-loop IBP reduction of Feynman integrals to the scalar master integrals"

[lib]
name = "oneloopreduce"

[dependencies]
feynkit-graph = { git = "https://github.com/alphal00p/gammaloop", branch = "preserve-canonical-numerator-interfaces", default-features = false }
feynkit-kinematics = { git = "https://github.com/alphal00p/gammaloop", branch = "preserve-canonical-numerator-interfaces", default-features = false }
# Must stay a crates.io version requirement -- see the note in the workspace
# root Cargo.toml.
#
# Symbolica 3.0 selects its numeric backends through feature pairs rather than
# its default set, so `default-features = false` is now correct here and the
# backend choice is forwarded from the consuming root via `native` / `wasm`.
# (Under 2.2 this was impossible -- dropping the defaults left numerica with
# neither an integer nor a float backend.)
symbolica = { version = "3.0.1", default-features = false }
stacker = "0.1.25"
thiserror = "2.0"

# The native master Symbols and their direct Rust numerical hooks are owned by
# oneloopmaster. Use one shared Symbolica kernel selected by the build root.
# WebAssembly retains symbolic reduction without the native numerical backend.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oneloop = { git = "https://github.com/alphal00p/oneloopmaster", branch = "main", default-features = false }

# Benchmark / validation harnesses -- not part of the library. Sources live under
# benchmarks/; run with e.g.
# `cargo run --release -p one-loop-reduce --example golden_master`.
# Each file's `//!` header says what it checks and how to invoke it.

[[example]]
name = "golden_master"
path = "benchmarks/golden_master.rs"

[[example]]
name = "emit_reductions"
path = "benchmarks/emit_reductions.rs"

[[example]]
name = "ggh_formfactor"
path = "benchmarks/ggh_formfactor.rs"

[[example]]
name = "wloop_reduce"
path = "benchmarks/wloop_reduce.rs"

[[example]]
name = "box_reduce"
path = "benchmarks/box_reduce.rs"

[[example]]
name = "massless_legs"
path = "benchmarks/massless_legs.rs"

[[example]]
name = "time_reduce"
path = "benchmarks/time_reduce.rs"

[features]
default = ["native"]
native = ["feynkit-graph/native", "feynkit-kinematics/native", "symbolica/integer-gmp", "symbolica/float-mpfr", "symbolica/native_code_generation"]
wasm = ["feynkit-graph/wasm", "feynkit-kinematics/wasm", "symbolica/wasm"]
