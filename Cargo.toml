# Virtual workspace. The library lives in `crates/one-loop-reduce`; the
# Symbolica-community Python binding lives in `crates/one-loop-reduce-python`.
#
# NOTE: neither member declares symbolica as a git dependency. Symbolica must be
# a plain crates.io version requirement so that a consuming root (e.g.
# symbolica-community) can redirect it with its own `[patch.crates-io]`; a git
# dep would compile a *second* copy of symbolica with a disjoint global symbol
# table. Standalone builds use the official Symbolica community branch, with
# exact revisions recorded in Cargo.lock; consuming roots remain authoritative.

[workspace]
resolver = "3"
members = [
    "crates/one-loop-reduce",
    "crates/one-loop-reduce-python",
]


[patch.crates-io]
symbolica-typst-plugin = { git = "https://github.com/symbolica-dev/symbolica-typst-plugin", rev = "57b7455b37c30f4f87353c0073e49f5225e937ab" }
symbolica = { git = "https://github.com/symbolica-dev/symbolica", branch = "community" }
numerica = { git = "https://github.com/symbolica-dev/symbolica", branch = "community" }
graphica = { git = "https://github.com/symbolica-dev/symbolica", branch = "community" }
